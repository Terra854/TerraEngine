# This gate exercises the installed authoring tools from a clean workspace. It
# deliberately avoids caches so missing generated files or undeclared runtime
# dependencies fail in the same way they would for a new contributor.
name: Windows Headless Export Baseline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-export-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-baseline:
    name: RelWithDebInfo build, install, and export
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_DIR: out/build/RelWithDebInfo
      INSTALL_ROOT: out/build/RelWithDebInfo/Build
      CI_ROOT: out/ci
      BASELINE_ROOT: out/ci/export-runtime-baseline
      LOG_ROOT: out/ci/logs

    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize x64 MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create clean log workspace
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath $env:CI_ROOT) {
            Remove-Item -LiteralPath $env:CI_ROOT -Recurse -Force
          }
          New-Item -ItemType Directory -Path $env:LOG_ROOT -Force | Out-Null

      - name: Configure RelWithDebInfo
        run: |
          $logPath = Join-Path $env:LOG_ROOT 'configure.log'
          & cmake --preset RelWithDebInfo 2>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Build export gate targets
        run: |
          $logPath = Join-Path $env:LOG_ROOT 'build.log'
          & cmake --build --preset RelWithDebInfo --parallel --target `
            TerraEngine-EngineTests `
            TerraEngine-EditorTests `
            TerraEngineModelPackageCompiler `
            TerraEngine-Export `
            TerraEngine-Editor 2>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Run focused export tests
        run: |
          $logPath = Join-Path $env:LOG_ROOT 'focused-ctest.log'
          & ctest --test-dir $env:BUILD_DIR -R 'Editor.ExportUnitTests|Editor.HeadlessExport' --output-on-failure 2>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Run full CTest suite
        run: |
          $logPath = Join-Path $env:LOG_ROOT 'ctest.log'
          & ctest --test-dir $env:BUILD_DIR --output-on-failure 2>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Install RelWithDebInfo tools and runtime
        run: |
          $logPath = Join-Path $env:LOG_ROOT 'install.log'
          & cmake --build --preset RelWithDebInfo --target install 2>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Verify installed tool layout
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredPaths = @(
            (Join-Path $env:INSTALL_ROOT 'Editor/TerraEngine-Export.exe'),
            (Join-Path $env:INSTALL_ROOT 'Editor/TerraEngineModelPackageCompiler.exe'),
            (Join-Path $env:INSTALL_ROOT 'Editor/Managed/TerraEngine.CSharp.dll'),
            (Join-Path $env:INSTALL_ROOT 'Editor/Managed/Analyzers/TerraEngine.Export.Generator.dll'),
            (Join-Path $env:INSTALL_ROOT 'Launcher/TerraEngine-Launcher.exe')
          )
          foreach ($requiredPath in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Installed export dependency is missing: $requiredPath"
            }
            "Verified installed path: $requiredPath" | Tee-Object -FilePath (Join-Path $env:LOG_ROOT 'install.log') -Append
          }

      - name: Run clean headless export baseline
        run: |
          $logPath = Join-Path $env:LOG_ROOT 'baseline-prepare.log'
          & pwsh -NoProfile -File Tools/ExportRuntimeBaseline/RunBaseline.ps1 `
            -InstallRoot $env:INSTALL_ROOT `
            -WorkRoot $env:BASELINE_ROOT 2>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Validate headless export evidence
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceDirectory = Join-Path $env:BASELINE_ROOT 'evidence'
          $requiredEvidence = @(
            'export-result.json',
            'resolved-manifest.json',
            'content-inventory.json',
            'validation-report.json',
            'progress.jsonl',
            'package-validation.txt'
          )
          foreach ($fileName in $requiredEvidence) {
            $filePath = Join-Path $evidenceDirectory $fileName
            if (-not (Test-Path -LiteralPath $filePath -PathType Leaf)) {
              throw "Required export evidence is missing: $filePath"
            }
          }

          $result = Get-Content -Raw -LiteralPath (Join-Path $evidenceDirectory 'export-result.json') | ConvertFrom-Json
          if ($result.schemaVersion -ne 1 -or -not $result.success -or $result.exitCode -ne 0) {
            throw 'The headless export result does not describe a successful schema-version-1 run.'
          }

          $inventory = Get-Content -Raw -LiteralPath (Join-Path $evidenceDirectory 'content-inventory.json') | ConvertFrom-Json
          $inventoryEntries = @($inventory.entries)
          if ($inventory.schemaVersion -ne 1 -or $inventory.entryCount -le 0 -or $inventory.entryCount -ne $inventoryEntries.Count) {
            throw 'The content inventory does not satisfy the schema-version-1 entry-count contract.'
          }
          $placeholderEntries = @($inventory.entries | Where-Object { $_.required -and $_.placeholderDetected })
          if ($placeholderEntries.Count -ne 0) {
            throw 'The published baseline inventory contains a required placeholder payload.'
          }
          $emptyRequiredEntries = @($inventory.entries | Where-Object { $_.required -and $_.byteSize -le 0 })
          if ($emptyRequiredEntries.Count -ne 0) {
            throw 'The published baseline inventory contains an empty required payload.'
          }

          Get-Content -Raw -LiteralPath (Join-Path $evidenceDirectory 'resolved-manifest.json') | ConvertFrom-Json | Out-Null
          Get-Content -Raw -LiteralPath (Join-Path $evidenceDirectory 'validation-report.json') | ConvertFrom-Json | Out-Null
          $progressRecords = @(Get-Content -LiteralPath (Join-Path $evidenceDirectory 'progress.jsonl') | ForEach-Object { $_ | ConvertFrom-Json })
          $finalRecords = @($progressRecords | Where-Object { $_.type -eq 'result' })
          if ($finalRecords.Count -ne 1 -or -not $finalRecords[0].success) {
            throw 'Progress evidence must contain exactly one successful final result record.'
          }

          $packageValidation = Get-Content -Raw -LiteralPath (Join-Path $evidenceDirectory 'package-validation.txt')
          if ([string]::IsNullOrWhiteSpace($packageValidation)) {
            throw 'The package validation summary is empty.'
          }
          $requiredPackageSignals = @(
            'Archive:',
            'Archive size:',
            'Entry count:',
            'Startup scene: PASS',
            'Required runtime entries: PASS',
            'Manifest asset references: PASS',
            'Manifest evidence match: PASS',
            'Placeholder scan: PASS',
            'Final: PASS'
          )
          foreach ($signal in $requiredPackageSignals) {
            if (-not $packageValidation.Contains($signal)) {
              throw "Package validation evidence is missing its '$signal' signal."
            }
          }

      # Collect partial logs as well as complete evidence. The staging step is
      # intentionally tolerant of missing late-stage files after an early fail.
      - name: Stage export evidence artifact
        if: ${{ always() }}
        run: |
          $artifactRoot = Join-Path $env:CI_ROOT 'artifacts/headless-export-evidence-windows-relwithdebinfo'
          $artifactEvidence = Join-Path $artifactRoot 'headless-export'
          New-Item -ItemType Directory -Path $artifactEvidence -Force | Out-Null

          $logNames = @('configure.log', 'build.log', 'focused-ctest.log', 'ctest.log', 'install.log', 'baseline-prepare.log')
          foreach ($logName in $logNames) {
            $sourcePath = Join-Path $env:LOG_ROOT $logName
            if (Test-Path -LiteralPath $sourcePath -PathType Leaf) {
              Copy-Item -LiteralPath $sourcePath -Destination (Join-Path $artifactRoot $logName) -Force
            }
          }

          $evidenceDirectory = Join-Path $env:BASELINE_ROOT 'evidence'
          if (Test-Path -LiteralPath $evidenceDirectory -PathType Container) {
            Copy-Item -Path (Join-Path $evidenceDirectory '*') -Destination $artifactEvidence -Recurse -Force
          }

      - name: Upload export evidence artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: headless-export-evidence-windows-relwithdebinfo
          path: out/ci/artifacts/headless-export-evidence-windows-relwithdebinfo
          if-no-files-found: warn
          retention-days: 14
